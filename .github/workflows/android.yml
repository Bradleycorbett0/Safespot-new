name: Build SafeSpot Google Play AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip tar wget curl \
            build-essential clang lld \
            libffi-dev libssl-dev \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev

      - name: Clean previous builds
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin
          rm -rf ~/.cache/pip
          rm -rf ~/.gradle/caches

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython==0.29.36
          python -m pip install buildozer==1.5.0

      - name: Restore and verify signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safespot-release.jks"

          test -s "$RUNNER_TEMP/safespot-release.jks"

          echo "Checking keystore..."

          keytool -list \
            -keystore "$RUNNER_TEMP/safespot-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Checking private key password..."

          keytool -certreq \
            -alias "$KEY_ALIAS" \
            -keystore "$RUNNER_TEMP/safespot-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -file "$RUNNER_TEMP/safespot-test.csr"

          echo "Signing keystore verification successful."

      - name: Build signed release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          export P4A_RELEASE_KEYSTORE="$RUNNER_TEMP/safespot-release.jks"
          export P4A_RELEASE_KEYSTORE_PASSWD="$KEYSTORE_PASSWORD"
          export P4A_RELEASE_KEYALIAS="$KEY_ALIAS"
          export P4A_RELEASE_KEYALIAS_PASSWD="$KEY_PASSWORD"

          buildozer android release

      - name: Verify AAB signing
        run: |
          set -e

          AAB=$(find bin -maxdepth 1 -name '*.aab' -print -quit)

          if [ -z "$AAB" ]; then
            echo "No AAB found"
            exit 1
          fi

          jarsigner -verify "$AAB"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SafeSpot-Signed-Google-Play-AAB
          path: bin/*.aab
          if-no-files-found: error
